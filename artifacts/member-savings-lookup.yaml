schema_version: '1.1'
id: member-savings-lookup
version: 2
title: Look up a member's savings balance
description: Signs in to the teller system, searches for a member by ID, and reads
  their name and balances off the member detail page.
target_domain: 127.0.0.1:5055
entry_url: http://127.0.0.1:5055/login
inputs:
- name: member_id
  description: The member ID to look up. Echoed back on the detail page, which is
    what makes the identity assertion possible.
  sensitive: true
secrets:
- name: username
- name: password
outputs:
- name: member_id
  description: The member ID shown on the record. Asserted equal to the requested
    one.
  target:
    frame: main
    candidates:
    - strategy: table_label
      value: label=Member ID,col=1
    - strategy: table_position
      value: row=0,col=1
  must_equal: '{{inputs.member_id}}'
  sensitive: true
- name: member_name
  description: The member's full name as shown on the record.
  target:
    frame: main
    candidates:
    - strategy: table_label
      value: label=Name,col=1
    - strategy: table_position
      value: row=1,col=1
  sensitive: true
- name: savings_balance
  type: money
  description: Current savings balance.
  target:
    frame: main
    candidates:
    - strategy: table_label
      value: label=Savings Balance,col=1
    - strategy: table_position
      value: row=3,col=1
  sensitive: true
- name: checking_balance
  type: money
  description: Current checking balance.
  target:
    frame: main
    candidates:
    - strategy: table_label
      value: label=Checking Balance,col=1
    - strategy: table_position
      value: row=4,col=1
  sensitive: true
steps:
- type: navigate
  url: http://127.0.0.1:5055/login
  description: Go to /login.
  risk: safe
  risk_note: declared destination /login; re-checked at replay
- type: fill
  description: Enter the username secret into the "User ID" field.
  target:
    candidates:
    - strategy: table_position
      value: row=1,col=1
    - strategy: css
      value: table:nth-child(1) > tbody:nth-child(1) > tr:nth-child(3) > td:nth-child(2)
        > input:nth-child(1)
  value: '{{secrets.username}}'
  risk: safe
  risk_note: no navigation; stayed on /login at discovery; re-checked at replay
- type: fill
  description: Enter the password secret into the "Password" field.
  target:
    candidates:
    - strategy: table_position
      value: row=2,col=1
    - strategy: css
      value: table:nth-child(1) > tbody:nth-child(1) > tr:nth-child(4) > td:nth-child(2)
        > input:nth-child(1)
  value: '{{secrets.password}}'
  risk: safe
  risk_note: no navigation; stayed on /login at discovery; re-checked at replay
- type: click
  description: Click the "Sign On" button.
  target:
    candidates:
    - strategy: role
      value: Sign On
      role: button
    - strategy: text
      value: Sign On
    - strategy: table_position
      value: row=3,col=0
    - strategy: css
      value: table:nth-child(1) > tbody:nth-child(1) > tr:nth-child(5) > td:nth-child(1)
        > input:nth-child(1)
  risk: safe
  risk_note: destination /app observed at discovery; re-checked at replay
- type: fill
  description: Enter the member_id input into the "Member ID or Last Name" field.
  target:
    frame: nav
    candidates:
    - strategy: table_position
      value: row=2,col=0
    - strategy: css
      value: table:nth-child(1) > tbody:nth-child(1) > tr:nth-child(4) > td:nth-child(1)
        > input:nth-child(1)
  value: '{{inputs.member_id}}'
  risk: safe
  risk_note: no navigation; stayed on /app at discovery; re-checked at replay
- type: click
  description: Click the "Search" button.
  target:
    frame: nav
    candidates:
    - strategy: role
      value: Search
      role: button
    - strategy: text
      value: Search
    - strategy: table_position
      value: row=3,col=0
    - strategy: css
      value: table:nth-child(1) > tbody:nth-child(1) > tr:nth-child(5) > td:nth-child(1)
        > input:nth-child(1)
  risk: safe
  risk_note: destination /app/search observed at discovery; re-checked at replay
- type: click
  description: Click the "View" link.
  target:
    frame: main
    candidates:
    - strategy: role
      value: View
      role: link
    - strategy: text
      value: View
    - strategy: table_position
      value: row=1,col=4
    - strategy: css
      value: table:nth-child(1) > tbody:nth-child(1) > tr:nth-child(2) > td:nth-child(5)
        > a:nth-child(1)
  risk: safe
  risk_note: destination /app/member/:member_id observed at discovery; re-checked
    at replay
checkpoint:
  frame: main
  candidates:
  - strategy: text
    value: Savings Balance
checkpoint_description: Page shows text matching "Savings Balance".
business_outcomes:
- name: member_not_found
  description: No member exists with the given ID.
  detect:
    frame: main
    candidates:
    - strategy: text
      value: No member found
- name: ambiguous_duplicate
  description: More than one member record matched; automation should not guess which
    one.
  detect:
    frame: main
    candidates:
    - strategy: text
      value: Multiple members matched
  requires_human: true
provenance:
  discovered_at: '2026-09-24T04:28:14.696615+00:00'
  discovery_model: claude-sonnet-5
  source_run_log: evidence/discovery-member-lookup/run_log.json
