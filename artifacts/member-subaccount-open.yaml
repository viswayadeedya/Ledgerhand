schema_version: '1.2'
id: member-subaccount-open
version: 1
title: Open a new sub-account for a member
description: Signs in to the teller system, finds a member, opens a new sub-account
  of the requested type with the requested initial deposit, and confirms it on the
  success screen. The final commit is an irreversible action and is blocked by policy
  unless a human approves it.
target_domain: 127.0.0.1:5055
entry_url: http://127.0.0.1:5055/login
inputs:
- name: member_id
  description: The member the sub-account is opened for.
  example: '00000'
  pattern: ^[0-9]{5}$
  sensitive: true
- name: account_type
  description: One of savings, checking, money_market.
  example: savings
  pattern: ^(savings|checking|money_market)$
- name: initial_deposit
  description: Opening deposit, at least 25.00.
  example: '25.00'
  pattern: ^[0-9]+\.[0-9]{2}$
secrets:
- name: username
- name: password
outputs:
- name: member_id
  description: The member the sub-account was opened for. Asserted equal to the requested
    one.
  target:
    frame: main
    candidates:
    - strategy: table_label
      value: label=Member ID,col=1
    - strategy: table_position
      value: row=0,col=1
  must_equal: '{{inputs.member_id}}'
  sensitive: true
- name: sub_account_number
  type: integer
  description: The number assigned to the new sub-account.
  target:
    frame: main
    candidates:
    - strategy: table_label
      value: label=Sub-Account Number,col=1
    - strategy: table_position
      value: row=1,col=1
  sensitive: true
- name: account_type
  description: The type actually opened, as confirmed by the app.
  target:
    frame: main
    candidates:
    - strategy: table_label
      value: label=Account Type,col=1
    - strategy: table_position
      value: row=2,col=1
- name: initial_deposit
  type: money
  description: The deposit actually recorded, as confirmed by the app.
  target:
    frame: main
    candidates:
    - strategy: table_label
      value: label=Initial Deposit,col=1
    - strategy: table_position
      value: row=3,col=1
  sensitive: true
steps:
- type: navigate
  url: http://127.0.0.1:5055/login
  description: Go to /login.
  risk: safe
  risk_note: declared destination /login; re-checked at replay
- type: fill
  description: Enter the username secret into the element matching 'input[name="username"]'.
  target:
    candidates:
    - strategy: css
      value: input[name="username"]
  value: '{{secrets.username}}'
  risk: safe
  risk_note: no navigation; stayed on /login at discovery; re-checked at replay
- type: fill
  description: Enter the password secret into the element matching 'input[name="password"]'.
  target:
    candidates:
    - strategy: css
      value: input[name="password"]
  value: '{{secrets.password}}'
  risk: safe
  risk_note: no navigation; stayed on /login at discovery; re-checked at replay
- type: click
  description: Click the "Sign On" button.
  target:
    candidates:
    - strategy: role
      value: Sign On
      role: button
    - strategy: css
      value: input[value="Sign On"]
  risk: safe
  risk_note: destination /app observed at discovery; re-checked at replay
- type: fill
  description: Enter the member_id input into the element matching 'input[name="q"]'.
  target:
    frame: nav
    candidates:
    - strategy: css
      value: input[name="q"]
  value: '{{inputs.member_id}}'
  risk: safe
  risk_note: no navigation; stayed on /app at discovery; re-checked at replay
- type: click
  description: Click the "Search" button.
  target:
    frame: nav
    candidates:
    - strategy: role
      value: Search
      role: button
    - strategy: css
      value: input[value="Search"]
  risk: safe
  risk_note: destination /app/search observed at discovery; re-checked at replay
- type: click
  description: Click the "View" link.
  target:
    frame: main
    candidates:
    - strategy: role
      value: View
      role: link
    - strategy: text
      value: View
  risk: safe
  risk_note: destination /app/member/:member_id observed at discovery; re-checked
    at replay
- type: click
  description: Click the "Open New Sub-Account" link.
  target:
    frame: main
    candidates:
    - strategy: role
      value: Open New Sub-Account
      role: link
    - strategy: text
      value: Open New Sub-Account
  risk: safe
  risk_note: destination /app/member/:member_id/new-subaccount observed at discovery;
    re-checked at replay
- type: select
  description: Choose the account_type input in the "Account Type:" field.
  target:
    frame: main
    candidates:
    - strategy: label
      value: 'Account Type:'
    - strategy: css
      value: '#account_type'
  value: '{{inputs.account_type}}'
  risk: safe
  risk_note: no navigation; stayed on /app at discovery; re-checked at replay
- type: fill
  description: Enter the initial_deposit input into the "Initial Deposit ($):" field.
  target:
    frame: main
    candidates:
    - strategy: label
      value: 'Initial Deposit ($):'
    - strategy: css
      value: '#initial_deposit'
  value: '{{inputs.initial_deposit}}'
  risk: safe
  risk_note: no navigation; stayed on /app at discovery; re-checked at replay
- type: click
  description: Click the "Continue" button.
  target:
    frame: main
    candidates:
    - strategy: role
      value: Continue
      role: button
    - strategy: css
      value: input[value="Continue"]
  risk: safe
  risk_note: destination /app/member/:member_id/new-subaccount/review observed at
    discovery; re-checked at replay
- type: click
  description: Click the "Confirm & Open Account" button.
  target:
    frame: main
    candidates:
    - strategy: role
      value: Confirm & Open Account
      role: button
    - strategy: css
      value: input[value="Confirm & Open Account"]
  risk: risky
  risk_note: destination /app/member/:member_id/new-subaccount/commit observed at
    discovery; re-checked at replay
checkpoint:
  frame: main
  candidates:
  - strategy: text
    value: opened
checkpoint_description: Page shows text matching "opened".
provenance:
  discovered_at: '2026-09-24T05:39:12.720853+00:00'
  discovery_model: deterministic-capture (no LLM; see scripts/capture_subaccount_capability.py)
